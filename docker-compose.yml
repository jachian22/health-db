services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: health_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d health_db"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - health_pg_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/health_db
      INGEST_API_KEY: dev-ingest-key-change-me
      READ_API_KEY: dev-read-key-change-me
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      PORT: "8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  health_pg_data:
